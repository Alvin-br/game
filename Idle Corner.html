<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idle Corner</title>
<style>
:root{--bg:#fbf6ef;--card:#fff;--ink:#2b2a33;--mute:#77737f;--acc:#e8683a;--acc2:#3a8fe8;--line:#eadfce;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161c;--card:#22212a;--ink:#f1eef6;--mute:#a09bac;--acc:#ff8a5c;--acc2:#6fb0ff;--line:#34323f}}
:root[data-theme="dark"]{--bg:#17161c;--card:#22212a;--ink:#f1eef6;--mute:#a09bac;--acc:#ff8a5c;--acc2:#6fb0ff;--line:#34323f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:2rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px;font-family:system-ui,sans-serif}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;font-family:system-ui,sans-serif}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:.95rem}
nav button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
section{display:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center;font-family:system-ui,sans-serif}
section.on{display:block}
.btn{border:0;background:var(--acc);color:#fff;padding:10px 18px;border-radius:12px;font-size:1rem;cursor:pointer;margin:4px}
.btn.alt{background:var(--acc2)}
/* breathe */
#orb{width:140px;height:140px;border-radius:50%;margin:30px auto;background:radial-gradient(circle at 35% 30%,var(--acc2),var(--acc));transition:transform 4s ease-in-out;transform:scale(.6)}
#orb.in{transform:scale(1.25)}
#bt{font-size:1.2rem;min-height:1.6em}
/* doodle */
canvas{width:100%;height:280px;background:#fff;border:1px solid var(--line);border-radius:12px;touch-action:none;display:block}
.tools{margin-top:10px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
/* pop */
#arena{position:relative;height:300px;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px}
.bub{position:absolute;border-radius:50%;border:0;cursor:pointer;opacity:.9}
.stat{display:flex;justify-content:space-around;font-size:1.05rem}
/* wyr */
.q{font-size:1.25rem;font-family:Georgia,serif;margin:18px 0;min-height:3.5em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{padding:16px 10px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1rem;cursor:pointer}
.opts button:hover{border-color:var(--acc)}
.small{color:var(--mute);font-size:.9rem;margin-top:10px}
</style>
</head>
<body>
<main>
<h1>Idle Corner</h1>
<p class="sub">No rush. Pick something and let the minutes drift by.</p>
<nav role="tablist">
<button role="tab" data-t="breathe" aria-selected="true">Breathe</button>
<button role="tab" data-t="doodle" aria-selected="false">Doodle</button>
<button role="tab" data-t="pop" aria-selected="false">Pop</button>
<button role="tab" data-t="wyr" aria-selected="false">Would you rather</button>
</nav>

<section id="breathe" class="on">
<div id="orb"></div>
<div id="bt">Press start</div>
<button class="btn" id="bstart">Start</button>
<p class="small">In for 4 seconds, out for 4 seconds.</p>
</section>

<section id="doodle">
<canvas id="cv"></canvas>
<div class="tools" id="tools"></div>
<div class="tools">
<input type="range" id="sz" min="2" max="24" value="5" aria-label="Brush size">
<button class="btn alt" id="clr">Clear</button>
</div>
</section>

<section id="pop">
<div class="stat"><span>Score: <b id="sc">0</b></span><span>Time: <b id="tm">30</b></span></div>
<div id="arena"></div>
<button class="btn" id="pstart">Start</button>
<p class="small" id="best"></p>
</section>

<section id="wyr">
<div class="q" id="q">Would you rather…</div>
<div class="opts"><button id="a"></button><button id="b"></button></div>
<p class="small" id="res"></p>
<button class="btn alt" id="nx">Next one</button>
</section>
</main>

<script>
// tabs
const tabs=document.querySelectorAll('nav button'),secs=document.querySelectorAll('section');
function show(t){tabs.forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));secs.forEach(s=>s.classList.toggle('on',s.id===t));if(t==='doodle')sizeCv()}
tabs.forEach(b=>b.onclick=()=>show(b.dataset.t));

// breathe
const orb=document.getElementById('orb'),bt=document.getElementById('bt'),bs=document.getElementById('bstart');
let bTimer=null,inh=false;
function step(){inh=!inh;orb.classList.toggle('in',inh);bt.textContent=inh?'Breathe in…':'Breathe out…'}
bs.onclick=()=>{if(bTimer){clearInterval(bTimer);bTimer=null;bs.textContent='Start';bt.textContent='Paused';orb.classList.remove('in');inh=false}else{step();bTimer=setInterval(step,4000);bs.textContent='Stop'}};

// doodle
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let col='#e8683a',drawing=false,last=null;
function sizeCv(){const r=cv.getBoundingClientRect();if(!r.width)return;const img=ctx.getImageData(0,0,cv.width,cv.height);cv.width=r.width;cv.height=r.height;ctx.putImageData(img,0,0);ctx.lineCap='round';ctx.lineJoin='round'}
['#e8683a','#3a8fe8','#2fa86b','#9b59d0','#2b2a33','#f2c230'].forEach(c=>{const s=document.createElement('button');s.className='sw';s.style.background=c;s.setAttribute('aria-label','Colour '+c);s.onclick=()=>col=c;document.getElementById('tools').appendChild(s)});
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener('pointerdown',e=>{drawing=true;last=pos(e);cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.strokeStyle=col;ctx.lineWidth=document.getElementById('sz').value;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});
['pointerup','pointercancel'].forEach(v=>cv.addEventListener(v,()=>drawing=false));
document.getElementById('clr').onclick=()=>ctx.clearRect(0,0,cv.width,cv.height);
window.addEventListener('resize',sizeCv);

// pop
const arena=document.getElementById('arena'),sc=document.getElementById('sc'),tm=document.getElementById('tm'),ps=document.getElementById('pstart'),bestEl=document.getElementById('best');
let score=0,time=30,spawn=null,clock=null,best=0;
try{best=+localStorage.getItem('idle-best')||0}catch(e){}
function showBest(){bestEl.textContent=best?'Best: '+best:''}showBest();
const cols=['#e8683a','#3a8fe8','#2fa86b','#9b59d0','#f2c230'];
function bubble(){const s=30+Math.random()*40,b=document.createElement('button');b.className='bub';b.setAttribute('aria-label','Bubble');
b.style.cssText+=`width:${s}px;height:${s}px;left:${Math.random()*(arena.clientWidth-s)}px;top:${Math.random()*(arena.clientHeight-s)}px;background:${cols[Math.random()*cols.length|0]}`;
b.onclick=()=>{b.remove();sc.textContent=++score};arena.appendChild(b);setTimeout(()=>b.remove(),1400)}
function end(){clearInterval(spawn);clearInterval(clock);arena.innerHTML='';ps.disabled=false;ps.textContent='Play again';
if(score>best){best=score;try{localStorage.setItem('idle-best',best)}catch(e){}}showBest()}
ps.onclick=()=>{score=0;time=30;sc.textContent=0;tm.textContent=30;ps.disabled=true;spawn=setInterval(bubble,550);clock=setInterval(()=>{tm.textContent=--time;if(time<=0)end()},1000)};

// would you rather
const Q=[["Always be 10 minutes early","Always be 10 minutes late"],["Have a pause button for life","Have a rewind button for 10 seconds"],["Live by the sea","Live in the mountains"],["Never have to sleep","Never have to eat"],["Speak every language","Play every instrument"],["Rain every weekend","Heatwave every weekend"],["Know the future","Change the past"],["A quiet cabin for a year","A big city for a year"],["Only sweet food forever","Only salty food forever"],["Fly slowly","Run super fast"],["Be a famous musician","Be a famous inventor"],["No phone for a month","No music for a month"]];
const qa=document.getElementById('a'),qb=document.getElementById('b'),res=document.getElementById('res');let order=[],i=-1;
function next(){if(i<0||i>=order.length-1){order=Q.map((_,k)=>k).sort(()=>Math.random()-.5);i=-1}i++;const [x,y]=Q[order[i]];qa.textContent=x;qb.textContent=y;res.textContent=''}
qa.onclick=()=>res.textContent='Bold choice. Now try the next one.';
qb.onclick=()=>res.textContent='Fair pick. Now try the next one.';
document.getElementById('nx').onclick=next;next();
</script>
</body>
</html>
